[package]
name = "sounddeck"
version = "0.3.0"
edition = "2021"
rust-version = "1.81"
authors = ["Mantum"]
repository = "https://github.com/mantuoum/SoundDeck"
description = "Lightweight Windows soundboard - Soundux-inspired, WASAPI-powered, portable"
license = "MIT"
build = "build.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts"] }
png = "0.18"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.5", features = [
    "aac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
windows = { version = "0.58", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
